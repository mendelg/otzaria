name: Cleanup PR Caches

# cache של PR נגיש רק לאותו PR, ולכן אחרי סגירתו הוא רק תופס מכסה.
# pull_request_target: ב-PR מ-fork ה-token של pull_request הוא לקריאה בלבד.
# בטוח כאן כי אין checkout של קוד ה-PR.
on:
  pull_request_target:
    types: [closed]

permissions:
  actions: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete caches of the closed PR
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh cache delete --all --ref "refs/pull/${{ github.event.pull_request.number }}/merge" --succeed-on-no-caches
